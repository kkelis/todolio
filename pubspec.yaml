name: todolio
description: A Flutter app for reminders, to-do lists, shopping lists, guarantee tracking, and notes.
publish_to: 'none'
version: 1.7.13+40

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.4.2

  # Image Handling
  image_picker: ^1.2.4
  path_provider: ^2.1.5
  file_picker: ^12.0.0

  # Notifications
  flutter_local_notifications: ^22.3.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.20.3
  share_plus: ^13.3.1
  timezone: ^0.11.2
  path: ^1.9.1
  package_info_plus: ^10.2.2

  # Barcode & QR Code
  barcode_widget: ^2.0.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

  # UI
  cupertino_icons: ^2.0.0
  flutter_svg: ^2.0.10
  
  # Backup/Restore
  archive: ^4.5.2
  
  # URL Launcher
  url_launcher: ^6.3.3
  open_filex: ^5.0.0
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/brands/